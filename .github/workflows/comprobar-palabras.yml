name: Comprobar palabras

# Se lanza solo cada vez que editas palabras.txt o config.json.
# Si algo está mal escrito, la ejecución sale en rojo y GitHub te avisa por correo.
on:
  push:
    paths:
      - palabras.txt
      - config.json
      - .github/workflows/comprobar-palabras.yml

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Leer palabras.txt
        run: |
          python3 -c "import json; json.load(open('config.json'))" || { echo "::error::config.json no es un JSON válido"; exit 1; }
          python3 radar.py --palabras
