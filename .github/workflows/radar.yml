name: Radar de chollos

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"   # cada 10 min, lejos de las horas en punto (GitHub va más saturado)
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        default: ronda
        options:
          - ronda
          - prueba
          - diagnostico
          - palabras
          - explorar

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Pillow (para unir foto y gráfica de Keepa)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow || echo "Sin Pillow, se mandará solo la gráfica"

      - name: OCR (para leer precios de la gráfica de Keepa)
        if: ${{ hashFiles('vigilar.txt') != '' }}
        run: |
          sudo apt-get install -y -qq tesseract-ocr > /dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null)
          tesseract --version | head -1

      - name: Recuperar estado anterior (rama gh-pages)
        run: |
          # Si GitHub falla al dar el estado, se para la ronda: empezar de cero repetiría avisos y mensajes.
          mkdir -p datos
          rc=1
          for i in 1 2 3; do
            rc=0; git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1 || rc=$?
            if [ "$rc" = 0 ] || [ "$rc" = 2 ]; then break; fi
            sleep 5
          done
          if [ "$rc" = 2 ]; then
            echo "Primera vez: todavía no hay rama gh-pages."
          elif [ "$rc" != 0 ]; then
            echo "::error::No se puede consultar la rama gh-pages; no sigo para no perder el estado."; exit 1
          else
            ok=0
            for i in 1 2 3; do
              if git fetch -q --depth=1 origin gh-pages; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then echo "::error::No se pudo descargar el estado; no sigo."; exit 1; fi
            git show FETCH_HEAD:estado.json  > datos/estado.json  2>/dev/null || rm -f datos/estado.json
            git show FETCH_HEAD:ofertas.json > datos/ofertas.json 2>/dev/null || rm -f datos/ofertas.json
          fi

      - name: Buscar chollos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          MODO: ${{ inputs.modo || 'ronda' }}
        run: |
          case "$MODO" in
            prueba)      python3 radar.py --prueba ;;
            diagnostico) python3 radar.py --diagnostico ;;
            palabras)    python3 radar.py --palabras ;;
            explorar)    python3 radar.py --explorar ;;
            *)           python3 radar.py ;;
          esac

      - name: Publicar web y estado
        # También si el paso anterior falla: así no se repiten los avisos que sí llegaron a enviarse
        if: ${{ always() && (inputs.modo || 'ronda') == 'ronda' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f datos/estado.json ]; then echo "No hay estado que guardar."; exit 0; fi
          mkdir -p _site
          cp web/* _site/
          cp datos/estado.json datos/ofertas.json _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Ronda $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
